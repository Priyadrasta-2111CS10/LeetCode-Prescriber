server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the built React app. Any path that isn't a real file falls
    # back to index.html so client-side routing (if you add any) works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the Spring Boot backend so the browser
    # only ever talks to this one origin — avoids CORS entirely in
    # production. Adjust the upstream host:port to wherever your
    # Spring Boot app actually runs (container name, internal DNS, etc).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reasonable caching for hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
