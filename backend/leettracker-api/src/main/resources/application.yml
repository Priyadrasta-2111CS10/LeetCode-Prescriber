spring:
  datasource:
    url: jdbc:postgresql://localhost:55432/leettracker
    username: leettracker
    password: leettracker
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never
  
  data:
    redis:
      host: localhost
      port: 6379
    
  # cache:
  #   type: redis
  #   redis:
  #     time-to-live: 10m

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
leettracker:
  python:
    base-url: ${PYTHON_SERVICE_URL:http://localhost:8000}


resilience4j:
  circuitbreaker:
    instances:
      pythonSync:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      
      pythonPracticePlan:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2

  retry:
    instances:
      pythonSync:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - com.leettracker.leettracker_api.exception.PythonServiceException

      pythonPracticePlan:
        max-attempts: 1
        wait-duration: 1s
        retry-exceptions:
          - com.leettracker.leettracker_api.exception.PythonServiceException

  timelimiter:
    instances:
      pythonSync:
        timeout-duration: 10s

  logging:
    level:
      org.springframework.cache: TRACE
      org.springframework.data.redis.cache: TRACE